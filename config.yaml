# ai-tech-radar 하이퍼파라미터
# 모든 튜닝 가능한 값은 이 파일에서 관리한다 (코드 하드코딩 금지)

db:
  # 엔진 비종속(SQLAlchemy). 배포 시 .env의 DATABASE_URL이 이 값을 덮어쓴다.
  #   개발     sqlite:///data/radar.db
  #   배포     postgresql+psycopg://user:pw@host:5432/aitrend
  #   사내 DB  oracle+oracledb://...  /  mysql+pymysql://...
  url: sqlite:///data/radar.db

# ── 3축 정의 ────────────────────────────────────────────────────────
# 교차 점수(score.py)의 기준. 항목이 걸치는 축 수가 많을수록 상위 노출된다.
# 여기 키워드는 ②키워드 prefilter에도 함께 쓰인다(무료 단계).
# ⚠️ 한글·영문을 반드시 함께 넣는다.
#   초판은 한글 위주(영문 AI 7 / 빅데이터 9 / 소상공인 0개)라 영어 소스가 거의 안 걸렸다.
#   실측(59,084건): 빅데이터 축 0.9%, 3축 교집합 53건(0.1%) — 교차 점수가 무의미해진다.
#   HN이 전부 영어이므로 영문 키워드가 없으면 그 소스는 통째로 0축이 된다.
#
# 매칭 규칙 (src/prefilter.py):
#   · 영문 키워드 — 앞뒤가 영숫자가 아닐 때만 매칭. 'AI'가 'SAID'에 안 걸리고
#     'AI가'처럼 조사가 붙어도 잡힌다. 대소문자 무시
#   · 4글자 이상 한글 — 양쪽 공백을 지우고 비교. '데이터플랫폼'으로 적어두면
#     기사의 '데이터 플랫폼'도 잡힌다(sobiz 기사에 '인공 지능'처럼 벌어진 표기가 많다)
#   · 4글자 미만 한글 — 원문 그대로만. 공백을 지우면 단어 경계를 넘어 오탐이 난다
#     (실측: '관점 포함'→점포, '더 이상 권장'→상권)
#
# 동음이의어에 주의한다. 짧은 영문 약어일수록 위험하다 — SMB(소상공인/파일공유
# 프로토콜)는 이 이유로 뺐다. 새 키워드를 넣은 뒤에는 반드시 재측정한다:
#   python -m src.prefilter --dry-run
axes:
  ai:
    label: AI
    keywords:
      - AI, 인공지능, LLM, 생성형, 초거대
      - 머신러닝, 딥러닝, 학습모델, 학습데이터, 추론
      - RAG, 임베딩, 벡터, 파인튜닝
      - 챗봇, 에이전트, 프롬프트
      - GPT, Claude, Gemini, Llama, OpenAI, Anthropic, Mistral, Copilot
      - 이상탐지, 수요예측, 시계열, 추천시스템
      # ── 영문 ──
      - machine learning, deep learning, neural network, transformer
      - foundation model, generative AI, fine-tuning, inference
      - MLOps, AI agent, prompt engineering, chatbot
      - computer vision, anomaly detection, forecasting, recommendation system
  bigdata:
    label: 빅데이터
    keywords:
      - 빅데이터, 데이터플랫폼, 데이터레이크, 웨어하우스, 데이터베이스
      - 데이터파이프라인, ETL, ELT, 오케스트레이션, 데이터인프라
      - Airflow, dbt, Spark, Kafka, DuckDB, Iceberg, Trino
      - 공공데이터, 데이터개방, 데이터표준, 정보공개, 데이터산업
      - 개인정보, 가명정보, 익명처리, 재식별
      - 데이터거버넌스, 마이데이터, 데이터결합, 데이터품질, 데이터활용
      # ── 영문 ──
      - data engineering, data platform, data pipeline, data infrastructure
      - data warehouse, data lake, lakehouse, database, analytics
      - SQL, BigQuery, Snowflake, Redshift, Postgres, PostgreSQL
      - Hadoop, Flink, Presto, Parquet, OLAP, ClickHouse, Elasticsearch
      - data governance, data quality, data catalog, open data
      - privacy, anonymization, GDPR
  smallbiz:
    label: 소상공인
    keywords:
      - 소상공인, 자영업, 소기업, 상권, 점포, 소매업
      - 전통시장, 골목상권, 프랜차이즈, 상인회, 소상공인연합회
      - 중기부, 중소벤처기업부, 소진공, 소상공인시장진흥공단
      - 상권분석, 매출데이터, 카드매출
      - 폐업, 창업, 자금지원, 정책자금
      # ── 영문 ──
      # SMB는 뺐다 — Server Message Block(파일 공유 프로토콜)과 동음이의어라
      # 기술 소스에서 오탐이 난다 (예: 'Apple이 Time Machine을 다시 망가뜨림')
      - small business, small merchant, local business
      - storefront, franchise, point of sale, merchant

# 교차 점수 가중치 — 팀 성격(a 분석·c 인프라·d 기획)에 맞춰 조정한다.
# 축 수가 많을수록 급격히 가중된다(교집합 우선 원칙).
# 값 근거: 600건 표본 시드 진단(seed_check.py). 1축 항목이 통과분의 대부분을
# 차지하면서 팀과 무관한 노이즈였다 → 1축을 억제하고 3축을 더 끌어올린다.
score:
  axis_count_weight: {1: 0.5, 2: 3.0, 3: 8.0}
  axis_weight: {ai: 1.0, bigdata: 1.2, smallbiz: 1.2}
  min_axes: 1           # 0축(어느 축에도 안 걸림) 항목은 버린다

# ── 소스별 설정 ─────────────────────────────────────────────────────
sources:

  # Hacker News — (c) 인프라·운영 사례. Algolia API, 무인증, 2007년부터 전체 아카이브.
  hackernews:
    enabled: true
    interval_days: 1          # 매일 전방 수집 (백필은 backfill.py가 따로 담당)
    max_pages: 5              # 일일 전방 수집의 쿼리당 페이지 상한
    api_url: https://hn.algolia.com/api/v1/search_by_date
    hits_per_page: 100
    request_interval: 0.3     # Algolia는 관대하지만 예의상 간격을 둔다
    max_retries: 3
    retry_backoff: 2.0
    min_points: 30            # 이 점수 미만 스토리는 수집 단계에서 제외 (볼륨 대응)
    backfill_years: 3
    # ── 수집 전략: 쿼리를 쓰지 않고 points 컷만 건다 ──
    #
    # 원래는 아래 queries로 좁혔는데, 실측 결과 이 방식이 동작하지 않았다(2026-08-30):
    #   · 짧은 단어(RAG)           → Algolia가 쿼리를 버리고 224건 반환. 대부분 무관
    #   · 다단어(data engineering) → 제목 완전일치라 30일간 0건
    # 어댑터에 removeWordsIfNoResults=none 등을 못박아 쿼리 자체는 고쳤지만
    # (src/sources/hackernews.py 참조), 쿼리 방식은 **무엇을 놓쳤는지 알 수 없다**는
    # 문제가 남는다. 반면 볼륨은 points 컷만으로 충분히 잡힌다:
    #   points>=20  연 37,000건 / >=30  연 31,000건 / >=50  연 24,000건
    # PLAN §8이 이미 ②키워드 prefilter → ③임베딩 필터의 2단 방어를 설계해뒀으므로,
    # 수집 단계에서는 넓게 받고 뒤에서 거르는 쪽이 커버리지 구멍이 없다.
    #
    # ⚠️ 기존 백필분 10,070건은 이 버그가 있던 시기 수집분이라 오염돼 있다.
    #    재수집 여부는 미결정 (HANDOFF.md 참조).
    #
    # 쿼리 방식으로 되돌리려면 아래 목록의 주석을 풀면 된다(어댑터는 양쪽 다 지원).
    queries: []
    # queries:
    #   - data engineering
    #   - analytics
    #   - RAG
    #   - duckdb
    #   - iceberg
    #   - airflow
    #   - dbt

  # GeekNews — (a)(c) 국내 실무 정보. Atom 피드는 최근 20~30건만 준다.
  geeknews:
    enabled: true
    interval_days: 1          # RSS 전방 수집 + 과거분 예산 소진이 매일 이뤄져야 한다
    rss_url: https://news.hada.io/rss/news
    topic_url: https://news.hada.io/topic?id={id}
    # 백필: topic id가 순차라 최신 id에서 역방향으로 훑는다.
    # ⚠️ 개인 운영 사이트다. 아래 제약을 반드시 지킨다 (PLAN.md §7 참조).
    # 과거분 수집: 하루 소량씩 나눠 쌓는다(일 1회 collect 실행 기준).
    #
    # 이력: 2026-08-26에 1.5초 간격으로 연속 수집하다 약 290건 지점에서 403이 걸렸다.
    #   그때 코드가 403을 '실패한 항목'으로 보고 199회를 더 두드린 게 문제였다.
    #   지금은 403/429를 받으면 그 실행을 즉시 중단하고 커서를 남긴 뒤 다음 날 재개한다.
    #   ⚠️ 차단을 우회하지 않는다 — User-Agent 변경·프록시·간격 축소는 하지 않는다.
    #      서버가 거부하면 멈추는 것이 이 설정의 전제다.
    backfill: true
    daily_crawl_limit: 150      # 하루 최대 요청 수(50건 배치 단위로 반올림)
                                #   150건/일 × 1.5초 ≈ 4분. 관측된 차단선의 절반 수준.
                                #   30일이면 약 4,500건 ≈ GeekNews 4~5개월치.
                                #   403이 자주 뜨면 이 값을 낮춘다.
    # 실측: id 31000=07-01, id 32898=08-26 → 하루 약 34건 발행
    backfill_max_items: 12000   # 과거로 내려갈 총 상한 (약 1년치)
    request_interval: 1.5       # ★ 1.5초 미만으로 낮추지 말 것
    max_retries: 2
    retry_backoff: 3.0
    # og: 메타태그(제목·요약)만 읽는다. 본문 DOM은 건드리지 않는다.
    use_og_meta_only: true

  # GeekNews 과거분 — Internet Archive 경유. 원 서버(news.hada.io) 요청 0건.
  # 라이브 어댑터가 하루 150건 제한이라 전체 3만여 건에 7개월이 걸리는 문제의 해법.
  # 실측: 아카이브에 28,526건(전체의 약 87%), 2019~2026년 스냅샷.
  geeknews_wayback:
    enabled: true
    cdx_url: "https://web.archive.org/cdx/search/cdx?url=news.hada.io/topic*&output=json&fl=original,timestamp&filter=statuscode:200&collapse=urlkey"
    # id_ 접미사 = Wayback 툴바·링크재작성이 주입되지 않은 원본 스냅샷
    snapshot_url: "https://web.archive.org/web/{timestamp}id_/{url}"
    topic_url: https://news.hada.io/topic?id={id}
    index_cache: data/checkpoints/geeknews_wayback_index.json
    index_ttl_days: 7          # 이 기간이 지나면 인덱스를 다시 받는다
    index_timeout: 180         # 인덱스는 2MB라 느리다
    skip_existing: true        # DB에 이미 있는 topic id는 요청하지 않는다
    request_interval: 1.0      # 실측 응답이 1.5~2초라 실제 간격은 그보다 길다
    batch_size: 50             # 체크포인트 갱신 주기
    timeout: 60
    max_retries: 2
    retry_backoff: 5.0

  # 네이버 뉴스 — 소상공인·AI·빅데이터·규제를 한 소스로 훑는다.
  #
  # ★ 이 소스는 백필이 불가능하다 → 매일 돌리는 게 전제다.
  #   API에 기간 파라미터가 없고 start ≤ 1000까지만 페이징된다. 즉 최신순 앞에서부터
  #   쿼리당 1,000건이 한계다. **오늘 안 받으면 오늘 기사는 영영 못 받는다.**
  #   과거분은 import_sobiz로 한 번 채워뒀다(2026-08-25까지).
  #
  # 쿼리가 곧 수집 주제 범위다. 쿼리를 늘리면 커버리지가 늘고 대신 노이즈도 는다
  # (노이즈는 뒤의 prefilter·filter가 걷어낸다 — 여기서 좁힐 필요는 없다).
  naver_news:
    enabled: true
    interval_days: 1           # 매일. 뉴스는 하루만 걸러도 구멍이 난다
    api_url: https://openapi.naver.com/v1/search/news.json
    sort: date                 # 최신순 — since보다 오래된 기사가 나오면 그 쿼리를 끊는다
    max_pages: 10              # 쿼리당 상한(= start 1000 / display 100)
    request_interval: 0.11     # 초당 10회 제한 준수
    max_retries: 3
    retry_backoff: 2.0
    # regulatory 플래그는 붙이지 않는다. 규제 알림(F7)의 판정은 **소스 기반**이라
    # 개인정보위 같은 1차 출처에서 온 항목만 규제로 본다. 아래 규제 쿼리는
    # "규제 관련 뉴스를 축적"하는 용도이지 알림 판정 대상이 아니다.
    regulatory: false
    queries:
      # ── 소상공인 축 (우리가 푸는 문제) ──
      - 소상공인 데이터
      - 소상공인 AI
      - 상권분석
      - 소상공인 디지털 전환
      - 스마트상점
      - 소상공인 정책자금
      - 전통시장 활성화
      # ── AI 축 (우리가 쓰는 기술) ──
      - 공공기관 AI 도입
      - 생성형 AI 활용
      - 인공지능 정책
      - AI 활용 사례
      # ── 빅데이터 축 (우리가 다루는 기반) ──
      - 공공데이터 개방
      - 데이터 플랫폼 구축
      - 빅데이터 활용
      - 마이데이터
      - 데이터 분석 사업
      # ── 규제·제도 (뉴스 경로. 1차 출처는 별도 어댑터로 붙일 예정) ──
      - 가명정보 결합
      - 개인정보보호법 개정
      - 개인정보위 가이드라인
      - AI 기본법

  # ── 규제 1차 출처 (F7 규제 알림) — 어댑터 미구현. 붙일 때 enabled를 켠다 ──
  # 규제 판정은 **소스 기반**이다: 여기 소스에서 온 항목은 제목과 무관하게 전부
  # 규제로 표시된다(collect.py의 _stamp_regulatory). 키워드 판정은 "규제 샌드박스
  # 선정 기업" 같은 오탐이 많아 쓰지 않는다.
  #
  # pipc:                     # 개인정보보호위원회 — 고시·가이드라인·행정예고
  #   enabled: false
  #   regulatory: true        # ★ 이 한 줄이 규제 알림 대상 여부를 결정한다
  #   interval_days: 1
  # assembly:                 # 국회 의안정보 — 법안 발의·통과
  #   enabled: false
  #   regulatory: true
  #   interval_days: 3        # 매일 볼 만큼 자주 안 바뀐다

# ── 일일 수집 엔진 (collect.py) ──────────────────────────────────────
# 소스를 순회하며 매일 1회 실행한다. 소스별로 try/except가 감싸져 있어
# 하나가 죽어도 나머지는 계속 돌고, 실패가 있으면 종료 코드 1로 알린다.
collect:
  # 전방 수집 기간(일). 하루 걸러도 구멍이 안 나게 여유를 둔다.
  # 소스별로 sources.<name>.days 로 덮어쓸 수 있다.
  days: 3

# ── sobiz 프로젝트 DB 임포트 ─────────────────────────────────────────
# 네이버 뉴스 API는 백필이 안 되지만, sobiz가 주간 배치로 누적한 news_articles가 있다.
# precision 92% 필터를 통과한 데이터라 품질도 보장된다.
import_sobiz:
  db_path: "../news_keyword/data/trends.db"
  table: news_articles
  since: "2025-01-01"        # 이 발행일 이후만 가져온다
  axes_hint: [smallbiz]      # 임포트분의 기본 축 (score.py가 재계산하되 출처 표시용)

# ── 백필 공통 ───────────────────────────────────────────────────────
backfill:
  checkpoint_dir: data/checkpoints
  out_dir: data/raw
  batch_flush: 500           # 이 건수마다 디스크에 flush + 체크포인트 갱신
  user_agent: "ai-tech-radar/0.1 (internal research; contact: {contact})"

# ── 2단계 필터 (2주차) ───────────────────────────────────────────────
prefilter:
  # 축 키워드 중 하나도 안 걸리면 임베딩 단계로 안 넘긴다 (비용 방어)
  min_axis_hits: 1

filter:
  model: BAAI/bge-m3          # 한·영 혼재라 다국어 모델. ko-sroberta는 쓰지 않는다
  seed_path: seeds/seed_sentences.txt
  # 시드 centroid 코사인 컷. 600건 표본 진단 결과:
  #   0.50 → 37.7% 통과 (경계선 대역이 전부 무관 항목이라 과다)
  #   0.55 → 11.3% 통과 ← 채택
  #   0.60 →  3.8% 통과 (너무 빡빡)
  # 수동 라벨 50건으로 precision 측정한 뒤 재튜닝한다(목표 ≥ 0.85).
  threshold: 0.55
  # 신디케이션 제거 컷. 같은 사건을 여러 매체가 받아쓴 기사를 하나로 접는다.
  # 쌍별이 아니라 연결 성분으로 군집을 만들어 군집당 1건만 남긴다(src/filter.py).
  #
  # 실측(2026-08-30, 통과분 5,015건)으로 정한 값이다:
  #   · 통과분 쌍별 유사도는 무관한 쌍이 0.50~0.60에 몰리고 신디케이션은 0.80 이상.
  #     골이 뚜렷해서 그 사이에 컷을 두면 된다
  #   · 0.92는 아무것도 못 잡았다 — KB금융 세미나 기사 37건이 그대로 통과했고
  #     그 상호 유사도가 0.655~0.917이었다(제목이 매체마다 달라 0.92를 못 넘는다)
  #   · 0.85에서 만들어진 군집 201개를 눈으로 확인한 결과 전부 같은 사건이었다
  #     (KB금융 세미나 37건, 총리 AI 발언 20건, 소진공 지능정보화위 14건 …)
  # 낮출수록 다른 주제가 연쇄로 묶일 위험이 커지므로 바꾸면 반드시 군집을 확인한다.
  dedup_threshold: 0.85
  batch_size: 64

# ── AI 해설 (3주차) ─────────────────────────────────────────────────
insight:
  enabled: true
  l1_model: claude-haiku-4-5-20251001   # 항목 해설 (주 200~300건)
  l2_model: claude-sonnet-5             # 주간 요약
  l3_model: claude-sonnet-5             # 월간 데이터 해석 (2차)
  l1_max_items: 300           # 비용 상한 — 교차 점수 상위부터 이 개수만 해설
  l1_max_tokens: 200
  team_profile_path: seeds/team_profile.md   # "우리 팀이 누구인지" — 해설 프롬프트에 주입
  # LLM 장애 시에도 다이제스트는 나가야 한다
  fail_open: true

# ── 다이제스트 (3주차) ───────────────────────────────────────────────
digest:
  top_per_axis: 5
  top_crossing: 5             # 교집합 섹션 노출 수
  mail_crossing: 3            # 메일에는 짧게 — 전문은 웹으로 유도
  week_start: monday

web:
  host: 0.0.0.0
  port: 8000
  page_size: 50
